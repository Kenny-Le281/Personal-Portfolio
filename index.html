<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenny Le · Software Engineer</title>
    <meta
      name="description"
      content="Kenny Le — Software Engineering student at uOttawa and Platform Engineer Co-op. An interactive, Kubernetes-style map of my experience, projects and skills."
    />
    <meta property="og:title" content="Kenny Le · Software Engineer" />
    <meta
      property="og:description"
      content="Explore my career as a live cluster: click pods, hover skills, or open the terminal."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
